<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#071A33"/>

  <!-- ROOF: mathematically mirrored -->
  <g fill="none" stroke="#D8B35A" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 260 520 C 360 455, 470 340, 600 190"
          stroke-width="18"/>
    <path d="M 320 520 C 420 455, 510 360, 600 245"
          stroke-width="9"/>
    <g transform="translate(1200 0) scale(-1 1)">
      <path d="M 260 520 C 360 455, 470 340, 600 190"
            stroke-width="18"/>
      <path d="M 320 520 C 420 455, 510 360, 600 245"
            stroke-width="9"/>
    </g>

    <!-- roof finial -->
    <path d="M 600 190 L 600 135" stroke-width="10"/>
    <path d="M 600 135 L 586 162 L 600 176 L 614 162 Z" fill="#D8B35A" stroke="none"/>

    <!-- central ridge -->
    <path d="M 600 245 L 600 410" stroke-width="9"/>

    <!-- Dayak-inspired ornament: left + mirrored right -->
    <g stroke-width="8">
      <polyline points="360.00,505.00 380.00,485.00 400.00,505.00 420.00,485.00"/>
      <polyline points="400.00,465.00 420.00,445.00 440.00,465.00 460.00,445.00"/>
      <polyline points="440.00,425.00 460.00,405.00 480.00,425.00 500.00,405.00"/>
      <polyline points="478.00,385.00 496.00,367.00 514.00,385.00 532.00,367.00"/>
      <polyline points="510.00,345.00 526.00,329.00 542.00,345.00 558.00,329.00"/>
    </g>
    <g transform="translate(1200 0) scale(-1 1)" stroke-width="8">
      <polyline points="360.00,505.00 380.00,485.00 400.00,505.00 420.00,485.00"/>
      <polyline points="400.00,465.00 420.00,445.00 440.00,465.00 460.00,445.00"/>
      <polyline points="440.00,425.00 460.00,405.00 480.00,425.00 500.00,405.00"/>
      <polyline points="478.00,385.00 496.00,367.00 514.00,385.00 532.00,367.00"/>
      <polyline points="510.00,345.00 526.00,329.00 542.00,345.00 558.00,329.00"/>
    </g>

    <!-- vertical pillars -->
    <path d="M 360 520 L 360 805" stroke-width="12"/>
    <path d="M 420 500 L 420 760" stroke-width="8"/>
    <path d="M 840 520 L 840 805" stroke-width="12"/>
    <path d="M 780 500 L 780 760" stroke-width="8"/>

    <!-- center diamond -->
    <path d="M 600 435 L 625 475 L 600 515 L 575 475 Z" stroke-width="9"/>

    <!-- bridge -->
    <path d="M 355 825 Q 600 650 845 825" stroke-width="18"/>
    <path d="M 420 825 Q 600 700 780 825" stroke-width="8"/>

    <!-- ground extensions -->
    <path d="M 255 825 L 355 825" stroke-width="5"/>
    <path d="M 845 825 L 945 825" stroke-width="5"/>
  </g>

  <!-- Jasmine, perfectly centered -->
  <g fill="#D8B35A">
    <path d="M 600.00,592.00 C 630.00,568.72 630.00,568.72 600.00,524.00 C 570.00,568.72 570.00,568.72 600.00,592.00 Z"/>
    <path d="M 617.12,604.44 C 648.53,625.78 648.53,625.78 681.79,583.42 C 629.99,568.71 629.99,568.71 617.12,604.44 Z"/>
    <path d="M 610.58,624.56 C 599.99,661.03 599.99,661.03 650.55,679.58 C 648.53,625.76 648.53,625.76 610.58,624.56 Z"/>
    <path d="M 589.42,624.56 C 551.47,625.76 551.47,625.76 549.45,679.58 C 600.01,661.03 600.01,661.03 589.42,624.56 Z"/>
    <path d="M 582.88,604.44 C 570.01,568.71 570.01,568.71 518.21,583.42 C 551.47,625.78 551.47,625.78 582.88,604.44 Z"/>
    <circle cx="600" cy="610" r="18" fill="#071A33"/>
    <circle cx="600" cy="610" r="7" fill="#D8B35A"/>
  </g>

  <!-- stem and leaves -->
  <g fill="none" stroke="#D8B35A" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 600 630 L 600 785" stroke-width="8"/>
    <path d="M 600 748 C 560 715, 520 700, 485 690" stroke-width="7"/>
    <path d="M 600 748 C 640 715, 680 700, 715 690" stroke-width="7"/>
  </g>
  <g fill="#D8B35A">
    <path d="M 485 690 C 515 664, 548 670, 560 705 C 530 714, 502 708, 485 690 Z"/>
    <path d="M 715 690 C 685 664, 652 670, 640 705 C 670 714, 698 708, 715 690 Z"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="1035" text-anchor="middle"
        fill="#D8B35A"
        font-family="Cinzel, Trajan Pro, Times New Roman, serif"
        font-size="150"
        letter-spacing="22">BALAI</text>
</svg>
